name: Update Coder Template

on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tools_json: ${{ steps.determine-tools.outputs.tools_to_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed directories (for Main branch push)
        id: changed-tools
        uses: tj-actions/changed-files@v46
        with:
          files: |
            src/**/*.*
          dir_names: true
          dir_names_max_depth: 2
          json: true

      - name: List all changed files
        env:
          ALL_FILES: ${{ steps.changed-tools.outputs.all_changed_files }}
        run: |
          for file in ${ALL_FILES}; do
            echo "$file was found"
          done

      - name: Set final tools to build output
        id: determine-tools
        run: |
          TOOLS_TO_BUILD="[]"
          IS_TAG_PUSH="false"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Detected Main Branch Push: Building changed tools."
            echo "Changed files: ${{ steps.changed-tools.outputs.all_changed_files }}"
            ALL_TOOLS=$(echo "${{ steps.changed-tools.outputs.all_changed_files }}" | jq -r '.[]' | awk -F '/' '{print $2}' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            TOOLS_TO_BUILD="$ALL_TOOLS"
          else
            echo "Unsupported event or branch: ${{ github.event_name }} on ${{ github.ref }}. Exiting."
            exit 0
          fi

          if [[ -z "$TOOLS_TO_BUILD" || "$TOOLS_TO_BUILD" == "null" ]]; then
            TOOLS_TO_BUILD="[]"
          fi

          echo "tools_to_build=$TOOLS_TO_BUILD" >> $GITHUB_OUTPUT
          echo "Final tools list: $TOOLS_TO_BUILD"

  update:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ fromJSON(needs.prepare.outputs.tools_json)[0] }}
    strategy:
      fail-fast: false
      matrix:
        template-id: ${{ fromJSON(needs.prepare.outputs.tools_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest commit hash
        id: latest_commit
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get commit title
        id: commit_title
        run: echo "title=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Install Coder CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(gh api repos/coder/coder/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"${release}")"
          version="${tag#v}"
          archive="coder_${version}_linux_amd64.tar.gz"
          checksums="coder_${version}_checksums.txt"
          download_url="https://github.com/coder/coder/releases/download/${tag}"

          mkdir -p "${HOME}/.local/bin" /tmp/coder-cli
          curl --fail --silent --show-error --location --retry 3 \
            "${download_url}/${archive}" \
            --output "/tmp/coder-cli/${archive}"
          curl --fail --silent --show-error --location --retry 3 \
            "${download_url}/${checksums}" \
            --output "/tmp/coder-cli/${checksums}"

          (
            cd /tmp/coder-cli
            grep " ${archive}$" "${checksums}" | sha256sum --check -
            tar --extract --gzip --file "${archive}" coder
          )

          install /tmp/coder-cli/coder "${HOME}/.local/bin/coder"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Update Coder Template
        env:
          CODER_URL: ${{ secrets.CODER_URL }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_API_TOKEN || secrets.CODER_SESSION_TOKEN }}
          CODER_TEMPLATE_ID: ${{ matrix.template-id }}
          CODER_TEMPLATE_DIR: src/${{ matrix.template-id }}
          CODER_TEMPLATE_VERSION_NAME: ${{ steps.latest_commit.outputs.hash }}
          CODER_TEMPLATE_MESSAGE: ${{ steps.commit_title.outputs.title }}
        run: |
          set -euo pipefail

          coder templates push "${CODER_TEMPLATE_ID}" \
            --directory "${CODER_TEMPLATE_DIR}" \
            --name "${CODER_TEMPLATE_VERSION_NAME}" \
            --message "${CODER_TEMPLATE_MESSAGE}" \
            --yes
